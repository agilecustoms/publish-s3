name: Build

on:
  push:

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: make app1-lint

      - name: Test
        run: make app2-test
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}

      # Idea is that if all tests pass, then it deserve to be built
      # It doesn't matter for 'build' workflow, but it does for 'build-and-release' workflow
      #  so I don't need to download all dependencies again
      - name: Build
        run: make app3-build

      - name: Upload artifacts
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next'
        uses: actions/upload-artifact@v7
        with:
          path: dist # take everything from dist/ folder

  Release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next'
    needs: Build
    runs-on: ubuntu-slim
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Release
        uses: agilecustoms/release@main
        env:
          GH_TOKEN: ${{ secrets.GH_PUBLIC_RELEASES_TOKEN }}
